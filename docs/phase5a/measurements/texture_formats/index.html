<!doctype html>
<html><head><meta charset="utf-8"><title>KTX2-Test</title>
<script type="importmap">{ "imports": { "three": "./three/build/three.module.js", "three/addons/": "./three/examples/jsm/" } }</script>
</head><body><canvas id="c" width="256" height="256"></canvas>
<script type="module">
import * as THREE from 'three';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c') });
const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 2);
const mat = new THREE.MeshBasicMaterial();
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
const ktx = new KTX2Loader().setTranscoderPath('./basis/').detectSupport(r);
const gl = r.getContext();
const ext = ['WEBGL_compressed_texture_astc', 'EXT_texture_compression_bptc', 'WEBGL_compressed_texture_s3tc', 'WEBGL_compressed_texture_etc', 'WEBGL_compressed_texture_etc1', 'WEBGL_compressed_texture_pvrtc'].filter((e) => gl.getExtension(e));
const files = ['albedo.webp', 'albedo.jpg', 'albedo.png', 'normal.webp', 'orm.webp', 'albedo.etc1s.ktx2', 'albedo.uastc.ktx2', 'normal.uastc.ktx2', 'orm.etc1s.ktx2', 'orm.uastc.ktx2'];
const res = { ext, gl: gl.getParameter(gl.RENDERER), files: {} };
async function one(f) {
  const t0 = performance.now();
  const tex = f.endsWith('.ktx2') ? await ktx.loadAsync('./tex/' + f) : await new THREE.TextureLoader().loadAsync('./tex/' + f);
  const t1 = performance.now();
  mat.map = tex;
  mat.needsUpdate = true;
  r.render(scene, cam);
  gl.finish();
  const t2 = performance.now();
  res.files[f] = { loadMs: Math.round(t1 - t0), uploadMs: Math.round(t2 - t1), format: tex.format, compressed: !!tex.isCompressedTexture, w: tex.image.width, h: tex.image.height, mips: tex.mipmaps ? tex.mipmaps.length : 0 };
  tex.dispose();
}
// zweimal: erster Durchgang wärmt Transcoder/Worker auf
for (const f of files) await one(f);
for (const f of files) await one(f);
window.__res = res;
</script></body></html>
